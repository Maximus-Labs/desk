<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

/* Layout: a dark MaximusLabs-style console. Left rail of views; Home = client cards, then Approve / Refill / Reply queues.
   Client view = card beside its settings, then the fill log; other sections are opt-in from the Sections picker. */
:root {
  --ground: #080808; --surface: #0f0f0f; --raised: #141414; --rail: #111111; --line: #2a2a2a; --line-soft: #1f1f1f;
  --text: #ffffff; --text2: #ababab; --text3: #757575;
  --signal: #0070e0; --sky: #449afb; --deep: #00143a;
  --good: #3dd68c; --good-soft: rgba(61, 214, 140, .12); --warn: #f5a524; --warn-soft: rgba(245, 165, 36, .12);
  --bad: #ff6b6b; --bad-soft: rgba(255, 107, 107, .12); --sky-soft: rgba(68, 154, 251, .12);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, "Courier New", monospace;
  --r-card: 14px; --r-ui: 8px; --r-pill: 999px;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { background: var(--ground); color: var(--text) }
body { font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased }
a { color: var(--sky); text-decoration: none }
a:hover { text-decoration: underline }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance }
h1 { font-size: 30px }
.label { font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--text3) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }

/* shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 28px;
  padding-block: 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 14px; background: var(--rail); border-right: 1px solid var(--line-soft) }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--sky), var(--signal)); flex: none }
.navlist { display: grid; gap: 4px }
.navgroup { margin: 10px 0 4px 10px }
.navbtn { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--r-ui); color: var(--text2); font-weight: 500; font-size: 14px }
.navbtn:hover { background: var(--raised); color: var(--text); text-decoration: none }
.navbtn[aria-current="page"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line) }
.navbtn .count { font-family: var(--mono); font-size: 11px; min-width: 20px; text-align: center; border-radius: var(--r-pill); padding: 1px 7px; background: var(--signal); color: #fff }
.navbtn .count:empty { display: none }
.navbtn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none }
.side-foot { margin-top: auto; font-size: 12px; color: var(--text3); font-family: var(--mono) }

.wrap { max-width: 1160px; width: 100%; margin: 0 auto; padding-block: 36px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; min-width: 0 }
.view { display: grid; gap: 40px; min-width: 0 }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px }
.page-head .sub { color: var(--text3); font-size: 14px; margin-top: 4px }
section { display: grid; gap: 16px; min-width: 0 }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px }
.sec-head h2 { font-size: 18px }
.banner { border: 1px solid var(--line); background: var(--surface); padding: 12px 16px; border-radius: var(--r-ui); color: var(--text2) }
.banner.err { border-color: rgba(255, 107, 107, .4); background: var(--bad-soft); color: var(--text) }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; align-items: start }
.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; display: grid; gap: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04) }
.card.refill { border-color: rgba(245, 165, 36, .45) }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px }
.card-head h3 { font-size: 17px }
.card-head h3 a { color: var(--text) }
.pill { font-family: var(--mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; padding: 3px 9px; border-radius: var(--r-pill); white-space: nowrap }
.pill.ok { background: var(--good-soft); color: var(--good) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.info { background: var(--sky-soft); color: var(--sky) }
.pill.quiet { background: var(--raised); color: var(--text3); box-shadow: inset 0 0 0 1px var(--line) }
.bank { display: grid; gap: 8px }
.bank-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 8px }
.bank-top b { font-family: var(--mono); font-size: 34px; font-weight: 500; letter-spacing: -0.03em }
.bank-top small { color: var(--text3); font-size: 13px }
.meter { position: relative; height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden }
.meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--signal), var(--sky)); border-radius: 3px }
.refill .meter i { background: var(--warn) }
.meter u { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text2); text-decoration: none }
.scale { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; font-size: 12px; color: var(--text3) }
dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 13.5px; padding-top: 14px; border-top: 1px solid var(--line-soft) }
dt { color: var(--text2) }
dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums }
dd.hot { color: var(--sky) }
.alerts { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0 }
.alerts .pill { white-space: normal; overflow-wrap: anywhere }

/* home queues */
.queues { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start }
.types { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1.3fr); gap: 0; padding-top: 14px; border-top: 1px solid var(--line-soft) }
.types div { display: grid; gap: 2px; padding: 0 8px; border-left: 1px solid var(--line-soft); min-width: 0 }
.types div:first-child { border-left: 0; padding-left: 0 }
.types b { font-family: var(--mono); font-size: 20px; font-weight: 500 }
.types span { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .02em; color: var(--text3); white-space: nowrap }
.types .t-paid b { color: var(--warn) }
.types .t-partnership b { color: var(--sky) }
.queue.type-exchange > header { box-shadow: inset 3px 0 0 var(--good) }
.queue.type-paid > header { box-shadow: inset 3px 0 0 var(--warn) }
.queue.type-partnership > header { box-shadow: inset 3px 0 0 var(--sky) }
.queue > header .why { display: block; font-size: 12.5px; font-weight: 400; color: var(--text3); margin-top: 2px; letter-spacing: 0 }
.queue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); display: grid; min-width: 0 }
.queue > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 16px 18px; border-bottom: 1px solid var(--line-soft) }
.queue > header h2 { font-size: 15px }
.queue .qcount { font-family: var(--mono); font-size: 12px; color: var(--text3) }
.queue ul { list-style: none; margin: 0; padding: 0 }
.qitem { padding: 14px 18px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 6px; min-width: 0 }
.qitem:last-child { border-bottom: 0 }
.qitem .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.qitem .who { font-weight: 500; overflow-wrap: anywhere }
.qitem .meta { color: var(--text3); font-size: 13px; overflow-wrap: anywhere }
.qitem .note { color: var(--text2); font-size: 13.5px }
.qempty { padding: 22px 18px; color: var(--text3); font-size: 14px }

/* drafts */
details.review > summary { cursor: pointer; color: var(--sky); font-size: 13.5px; list-style: none }
details.review > summary::-webkit-details-marker { display: none }
details.review[open] > summary { margin-bottom: 10px }
.body { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--sans); font-size: 14px; margin: 0; padding: 12px 14px; background: var(--ground); border-radius: var(--r-ui); border: 1px solid var(--line); color: var(--text) }
textarea.body { width: 100%; min-height: 220px; resize: vertical }
.body mark { background: var(--warn-soft); color: var(--warn); border-radius: 3px; padding: 0 2px }
.theirs { margin: 0; padding: 4px 0 4px 12px; border-left: 2px solid var(--line); color: var(--text3); font-size: 13px }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px }
.btn { font: inherit; font-size: 13.5px; font-weight: 500; padding: 7px 16px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--raised); color: var(--text); cursor: pointer }
.btn:hover { border-color: var(--text3) }
.btn.primary { background: var(--signal); border-color: var(--signal) }
.btn.primary:hover { background: #0a7ff0 }
.btn.danger { color: var(--bad); border-color: rgba(255, 107, 107, .4); background: transparent }
.btn:disabled { opacity: .45; cursor: not-allowed }
.hint { font-size: 13px; color: var(--text3) }
.hint.err { color: var(--bad) }
.hint.ok { color: var(--good) }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: var(--r-ui); background: var(--sky-soft); font-size: 13.5px }
.confirm.danger { background: var(--bad-soft) }
.toinput { font: inherit; font-size: 13.5px; padding: 6px 10px; border-radius: var(--r-ui); border: 1px solid var(--line); background: var(--ground); color: var(--text); min-width: 0; flex: 1 1 220px }

/* client view */
.client-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; display: grid; gap: 10px; min-width: 0 }
.panel textarea, .panel input { font: inherit; font-size: 14px; padding: 9px 12px; border-radius: var(--r-ui); border: 1px solid var(--line); background: var(--ground); color: var(--text); width: 100%; min-width: 0; resize: vertical }
.panel textarea { min-height: 150px; line-height: 1.55 }
.panel textarea[readonly], .panel input[readonly] { color: var(--text2) }
.linkrow { display: flex; gap: 8px; align-items: center }
.linkrow a { flex: none; font-size: 13.5px }

/* sections picker */
.picker { position: relative }
.picker > summary { list-style: none; cursor: pointer }
.picker > summary::-webkit-details-marker { display: none }
.picker .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 230px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-ui); padding: 8px; display: grid; gap: 2px; box-shadow: 0 20px 40px rgba(0,0,0,.6) }
.picker label { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 6px; font-size: 14px; cursor: pointer }
.picker label:hover { background: var(--surface) }
.picker input { accent-color: var(--signal) }

/* tables */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card) }
table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 13.5px }
th { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--text3) }
td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; color: var(--text2) }
tr:last-child td { border-bottom: 0 }
td.strong { color: var(--text); font-weight: 500 }
td small { display: block; color: var(--text3) }
td.quote { max-width: 320px }
td.when { white-space: nowrap }
td.url a { overflow-wrap: anywhere }
.empty { padding: 26px 16px; text-align: center; color: var(--text3) }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px }
.tabs button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--text3); padding: 5px 12px; border-radius: var(--r-pill); cursor: pointer }
.tabs button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line) }
details.blurb summary { cursor: pointer; color: var(--sky) }
details.blurb p { white-space: pre-wrap; margin: 6px 0 0; max-width: 360px }

@media (max-width: 980px) { .queues { grid-template-columns: 1fr } .client-top { grid-template-columns: 1fr } }
@media (max-width: 380px) { .types b { font-size: 17px } }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr) }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line-soft);
    padding-block: 14px; padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .navlist { display: flex; overflow-x: auto; gap: 4px; flex: 1 1 100%; min-width: 0 }
  .navgroup { display: none }
  .navbtn { white-space: nowrap }
  .side-foot { margin-top: 0 }
  h1 { font-size: 26px }
}
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .4s ease } }

.home-top > .daybox { align-content: start } .home-top > #home-cal, .home-top .cal { height: 100%; box-sizing: border-box }
.daybox ul { flex: 1 }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 18px 14px; display: grid; gap: 10px; min-width: 0 }

.dd-btn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; text-align: right }

dialog.ov li { padding: 9px 0; border-bottom: 1px solid var(--line) } dialog.ov li:last-child { border: 0 }
.ov-co { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 500 }
.ov-names { color: var(--text3); font-size: 13px; margin-top: 3px }
dialog.ov footer { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--text3) }
.stamp { font-family: var(--mono); font-size: 13.5px; font-weight: 500; color: var(--sky); background: var(--sky-soft); border: 1px solid rgba(80, 160, 255, .25); padding: 7px 14px; border-radius: var(--r-pill); white-space: nowrap; align-self: start }
.view, .view > section, section > *, .sec-head > * { min-width: 0 }
.seg { max-width: 100% }
.scroll2 thead th { position: sticky; top: 0; background: var(--surface); z-index: 1 }
@media (max-width: 820px) {
  .seg { width: 100%; flex-wrap: nowrap; overflow-x: auto }
  .side .navlist { display: flex; flex-wrap: nowrap; overflow-x: auto; width: 100%; gap: 4px }
  .side .navlist .navgroup { display: none }
  .side .navbtn { flex: none }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Views">
    <div class="brand"><i aria-hidden="true"></i>Outreach Desk</div>
    <div class="navlist" id="nav">
      <a href="/desk/" class="navbtn" id="nav-home"><span>Home</span></a>
      <span class="label navgroup">Clients</span>
    </div>
    <div class="side-foot" id="updated">Loading…</div>
  </nav>

  <main class="wrap">
    <div id="banner" class="banner" hidden></div>

    <!-- HOME (team) -->
    <div id="view-home" class="view" hidden>
      <header class="page-head">
        <div><h1>Home</h1><div class="sub">Refreshed after the 9:10 and 15:10 IST runs</div></div>
        <span class="stamp" id="home-updated"></span>
      </header>
      <section aria-label="Emails per day">
        <div class="home-top"><div class="daybox" id="home-day"></div><div id="home-cal"></div></div>
      </section>
      <section aria-label="Clients"><div class="cards" id="cards"></div></section>
    </div>

    <!-- CLIENT -->
    <div id="view-client" class="view" hidden>
      <header class="page-head">
        <h1 id="client-name">Client</h1>
        <span class="stamp" id="client-updated"></span>
      </header>
      <div class="top2"><div id="client-card"></div><div id="client-cal"></div></div>
      <section aria-labelledby="h-st">
        <div class="sec-head">
          <h2 id="h-st">Outreach status</h2>
          <div class="seg" role="tablist" aria-label="Outreach status" id="seg"></div>
        </div>
        <p class="hint" id="st-hint"></p>
        <div class="table-wrap">
          <table>
            <thead id="st-head"></thead>
            <tbody id="st-body"></tbody>
          </table>
        </div>
      </section>
      <section aria-labelledby="h-fills">
        <div class="sec-head"><h2 id="h-fills">Refill log</h2><span class="hint" id="fills-when"></span></div>
        <div class="table-wrap scroll2" id="fills-wrap">
          <table>
            <thead><tr><th>Date &amp; time</th><th>Source</th><th>Emails scheduled</th><th>Waiting</th><th>Left</th></tr></thead>
            <tbody id="fills"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
  const MODE = "client";            // "team" (Home) or "client" (one client's page)
  const DATA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPvpCzNxY6EJTCITdki-rIhAjDDUWakWFoq3HKMncW32sa2dBgDJAx_dUv00aH2WbNy99NmtJoQNyT/pub?gid=1776067897&single=true&output=csv";            // the published Site tab (CSV, one cell holding the JSON)
  const SLUG = "maximuslabs";
  const BASE = "/desk";            // the site's path prefix ("/desk" on GitHub Pages, "" at a domain root)
  const THRESHOLD = 30;
  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v); }
    for (const k of kids) if (k != null && k !== false) n.append(k);
    return n;
  };
  const stagePill = s => {
    const cls = s === "Link live" ? "ok" : s === "New reply" || s === "Wants payment" ? "bad" : s === "Agreed, awaiting link" ? "info"
      : ["Declined", "Not a fit", "Bounced", "Unsubscribed"].includes(s) ? "quiet" : "warn";
    return el("span", { class: "pill " + cls, text: s || "New reply" });
  };
  const link = url => url ? el("a", { href: /^https?:\/\//.test(url) ? url : "https://" + url, target: "_blank", rel: "noopener", text: url.replace(/^https?:\/\/(www\.)?/, "") }) : "–";
  const empty = (cols, text) => el("tr", {}, el("td", { colspan: String(cols), class: "empty", text }));

  // Small overlay listing companies (domain, first names under it, "N people" when more than one).
  function overlay(title, groups, foot) {
    const dlg = el("dialog", { class: "ov", "aria-label": title });
    const close = el("button", { type: "button", class: "ov-x", "aria-label": "Close", text: "✕" });
    close.onclick = () => dlg.close();
    dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener("close", () => dlg.remove());
    dlg.append(el("header", {}, el("h3", { text: title }), close),
      el("ul", {}, ...(groups.length ? groups.map(g => el("li", {},
        el("div", { class: "ov-co" }, el("span", { text: g.company }), g.people > 1 ? el("span", { class: "pill info", text: g.people + " people" }) : null,
          ...(g.tags || []).map(t => el("span", { class: "pill warn", text: t }))),
        el("div", { class: "ov-names", text: (g.names || []).join(" · ") || "–" }))) : [el("li", { class: "ov-names", text: "Nobody here right now." })])),
      ...(foot ? [el("footer", { text: foot })] : []));
    document.body.append(dlg); dlg.showModal();
  }

  // Breakdown behind "Emails sent": the total equals the calendar's ↗ sum; bounces and follow-ups live here.
  function sentBox(c) {
    // Delivered = Apollo's delivered count (the report's "Emails sent"); bounced = first emails sent minus delivered.
    const total = c.sent_total ?? c.sent ?? 0, delivered = Number(c.sent) || 0;
    const b = delivered ? Math.max(total - delivered, 0) : (c.bounced || 0);
    const row = (label, v, cls) => el("li", {}, el("div", { class: "ov-co" }, el("span", { text: label }), el("span", { class: "ov-num " + (cls || ""), text: String(v) })));
    const dlg = el("dialog", { class: "ov", "aria-label": "Emails sent" });
    const close = el("button", { type: "button", class: "ov-x", "aria-label": "Close", text: "✕" });
    close.onclick = () => dlg.close();
    dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener("close", () => dlg.remove());
    dlg.append(el("header", {}, el("h3", { text: `Emails sent · ${total}` }), close),
      el("ul", {}, row("Emails sent (first emails)", total, "s"), row("Delivered", delivered || Math.max(total - b, 0)), row("Bounced back", b, "bad"),
        row("Follow-ups sent", c.follow_ups || 0, "f")),
      el("footer", { text: "Sent = every first email, the same total as the calendar's ↗. Follow-ups are counted separately." }));
    document.body.append(dlg); dlg.showModal();
  }

  function card(c, href) {
    // Older data (before the 15:10 run) lacks these totals: derive them from the calendar and the bounce alert.
    const dv = Object.values(c.days || {});
    if (c.sent_total == null && dv.length) c.sent_total = dv.reduce((a, v) => a + (v[0] || 0), 0);
    if (c.follow_ups == null) c.follow_ups = dv.reduce((a, v) => a + (v[2] || 0), 0);
    const bm = (c.alerts || []).map(a => /^Bounce rate (\d+)\//.exec(a)).find(Boolean);
    if (c.bounced == null) c.bounced = bm ? Number(bm[1]) : 0;
    c.alerts = (c.alerts || []).filter(a => !/^Bounce rate/.test(a));
    const card = el("article", { class: "card" });
    card.append(el("div", { class: "card-head" }, el("h3", {}, href ? el("a", { href, text: c.name }) : c.name)));
    const n = v => v === "" || v == null ? "–" : String(v);
    const ex = c.exchange || { companies: 0, swaps: 0 };
    const people = c.reply_people || 0;
    const recv = () => overlay(`Emails received · ${n(c.replies)} companies`, c.ov_received || [], `${people} people from ${n(c.replies)} companies`);
    // [label, number, unit word, onClick, highlight]: numbers share one column, unit words follow in small grey text.
    const rows = [
      ["Emails scheduled", n(c.scheduled)],
      ["Emails sent", n(c.sent_total ?? c.sent), "", () => sentBox(c)],
      ["Emails received", n(c.replies), "companies", recv],
      ["", String(people), "people", recv],
      ["Open threads", n(c.open), "", () => overlay(`Open threads · ${n(c.open)}`, c.ov_open || [])],
      ["Needs our reply", n(c.needs_reply), "", () => overlay(`Needs our reply · ${n(c.needs_reply)}`, c.ov_reply || []), Number(c.needs_reply) > 0],
      ["Needs client reply", n(c.partner_reply)],
      ["Exchange", String(ex.companies), "companies"],
      ["", String(ex.swaps), "exchanges"],
    ];
    const dl = el("dl", { class: "rowsA" });
    for (const [label, v, unit, open, hot] of rows) {
      const num = el("dd", { class: "num" + (hot ? " hot" : "") + (label ? "" : " sub") });
      const u = el("dd", { class: "unit" + (label ? "" : " sub") }, unit || "", open && label ? el("span", { class: "chev", "aria-hidden": "true", text: " ›" }) : null);
      if (open) { const b = el("button", { type: "button", class: "dd-btn", "aria-haspopup": "dialog", "aria-label": `${label || "people"}: ${v}, show list` }, v); b.onclick = open; num.append(b); u.style.cursor = "pointer"; u.onclick = open; }
      else num.textContent = v;
      dl.append(el("dt", { class: label ? null : "sub", text: label }), num, u);
    }
    card.append(dl);
    card.append(el("div", { class: "alerts card-foot" }, ...(c.alerts || []).map(a => el("span", { class: "pill warn", text: a }))));
    return card;
  }

  function nav(d) {
    const box = $("nav");
    for (const c of d.clients) box.append(el("a", { href: BASE + "/" + c.slug + "/", class: "navbtn", "aria-current": MODE === "client" && c.slug === SLUG ? "page" : null },
      el("span", { text: c.name }), c.needs_reply ? el("b", { class: "count", text: String(c.needs_reply) }) : null));
    if (MODE === "team") $("nav-home").setAttribute("aria-current", "page");
  }


  const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const todayIST = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
  const pretty = d => { const [y, m, dd] = d.split("-").map(Number); const w = new Date(Date.UTC(y, m - 1, dd)).toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" }); return `${w} ${dd} ${MON[m - 1].slice(0, 3)}`; };
  // Only the numbers above zero; nothing at all reads "no activity".
  // ↗ sent · ↙ replies; only numbers above zero, "no activity" when both are zero.
  const pair = (s, r, f = 0, words = false) => {
    const parts = [[s, "s", "↗", "sent"], [r, "r", "↙", "replies"]].filter(x => x[0]);
    return parts.length ? parts.flatMap(([v, c, sym, w], i) => [i ? "  " : null, el("b", { class: c, text: `${sym} ${v}${words ? " " + w : ""}` })])
      : [el("span", { text: "no activity" })];
  };
  const counts = (s, r) => [s ? el("span", { class: "s", text: "↗" + s }) : null, r ? el("span", { class: "r", text: "↙" + r }) : null];

  // days: {"YYYY-MM-DD": [sent, replies]}; onPick(day) is called on load (today) and on each click.
  function calendar(box, days, onPick) {
    const today = todayIST();
    let ym = today.slice(0, 7), sel = today;
    const draw = () => {
      const [y, m] = ym.split("-").map(Number);
      const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const prev = el("button", { type: "button", "aria-label": "Previous month", text: "‹" }), next = el("button", { type: "button", "aria-label": "Next month", text: "›" });
      prev.onclick = () => { const d = new Date(Date.UTC(y, m - 2, 1)); ym = d.toISOString().slice(0, 7); draw(); };
      next.onclick = () => { const d = new Date(Date.UTC(y, m, 1)); ym = d.toISOString().slice(0, 7); draw(); };
      if (ym >= today.slice(0, 7)) next.disabled = true;
      const grid = el("div", { class: "cal-grid" }, ...["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w => el("div", { class: "cal-wd", text: w })));
      for (let i = 0; i < first; i++) grid.append(el("div", { class: "cal-day blank" }));
      let ms = 0, mr = 0, mf = 0;
      for (let dd = 1; dd <= n; dd++) {
        const day = `${ym}-${String(dd).padStart(2, "0")}`, [s, r, f = 0] = days[day] || [0, 0, 0], fut = day > today;
        ms += s; mr += r; mf += f;
        const b = el("button", { type: "button", class: "cal-day" + (day === today ? " today" : "") + (day === sel ? " sel" : "") + (fut ? " future" : ""),
          "aria-label": `${pretty(day)}: ${s} sent, ${r} replies` }, el("span", { class: "n", text: String(dd) }), el("span", { class: "c" }, ...(fut ? [] : counts(s, r))));
        if (fut) b.disabled = true; else b.onclick = () => { sel = day; draw(); onPick(day); };
        grid.append(b);
      }
      const [ss, sr, sf = 0] = days[sel] || [0, 0, 0];
      box.replaceChildren(el("div", { class: "cal" },
        el("div", { class: "cal-head" }, el("h3", { text: `${MON[m - 1]} ${y}` }), el("span", {}, prev, " ", next)),
        grid,
        el("div", { class: "cal-foot" },
          el("span", {}, pretty(sel) + ": ", ...pair(ss, sr, sf, true)),
          el("span", {}, "This month: ", ...pair(ms, mr, mf, true)))));
    };
    draw(); onPick(sel);
  }

  function homeDay(d, day) {
    const per = d.clients.map(c => [c.name, ...((c.days || {})[day] || [0, 0, 0])]);
    const ts = per.reduce((a, x) => a + x[1], 0), tr = per.reduce((a, x) => a + x[2], 0), tf = per.reduce((a, x) => a + (x[3] || 0), 0);
    const big = [[ts, "s", "↗", "sent"], [tr, "r", "↙", "replies"]].filter(x => x[0]);
    $("home-day").replaceChildren(el("h3", { text: `${pretty(day)} · all clients` }),
      el("div", { class: "big" }, ...(big.length ? big.map(([v, c, sym, w]) => el("span", { class: c }, sym + v, el("small", { text: w })))
        : [el("span", { class: "ph", text: "No emails this day" })])),
      el("ul", {}, ...per.map(([name, s, r, f = 0]) => el("li", {}, el("span", { text: name }),
        el("span", {}, ...(s || r ? counts(s, r).filter(Boolean).map(x => { x.style.fontWeight = 600; return x; }) : [el("b", { class: "ph", text: "–" })]))))));
  }

  function renderTeam(d) {
    $("cards").replaceChildren(...d.clients.map(c => card(c, BASE + "/" + c.slug + "/")));
    const all = {};
    for (const c of d.clients) for (const [day, [s, r, f = 0]] of Object.entries(c.days || {})) { const a = all[day] || (all[day] = [0, 0, 0]); a[0] += s; a[1] += r; a[2] += f; }
    calendar($("home-cal"), all, day => homeDay(d, day));
    $("view-home").hidden = false;
  }

  const day = s => s ? s.slice(0, 10) : "–";
  const VIEWS = [
    { key: "completed", label: "Completed", hint: "Each partner, the page that lists us, and the page where we listed them.",
      head: ["Partner", "Their page (lists us)", "Our page (lists them)", "Live since"], empty: "No completed link exchanges yet.",
      rows: c => c.exchanges || [], row: x => [el("td", { class: "partner", text: x.partner }),
        el("td", { class: "url" }, link(x.their_url), x.their_date ? el("small", { text: x.their_date }) : null),
        el("td", { class: "url" }, link(x.our_url), x.our_date ? el("small", { text: x.our_date }) : null),
        el("td", { class: "when num", text: x.live || "–" })] },
    { key: "list_reply", label: "Needs our reply", hint: "They replied and the next message is ours, or we wrote and have had no reply for 5 days.",
      head: ["Company", "Contact", "Status", "Last message"], empty: "Nobody is waiting on us." },
    { key: "list_waiting", label: "Needs client reply", hint: "We sent the last email and are waiting for them. After 5 days with no answer it moves to Needs our reply.",
      head: ["Company", "Contact", "Status", "Last message"], empty: "No conversation is waiting on them." },
    { key: "list_paid", label: "Paid", hint: "They offered a paid placement instead of a link exchange.",
      head: ["Company", "Contact", "Status", "Last message"], empty: "No paid offers." },
    { key: "list_others", label: "Others", hint: "Not going ahead: declined, not a fit, bounced, or a partnership offer we are not taking up now.",
      head: ["Company", "Contact", "Status", "Last message"], empty: "Nothing here." },
  ];
  const convRow = (x, key) => [el("td", { class: "co", text: x.company }), el("td", { text: x.contact || "–" }),
    el("td", {}, stagePill(x.stage), x.tag ? el("span", { class: "pill warn", style: "margin-left:6px", text: x.tag }) : null),
    el("td", { class: "when num", text: day(x.last_at) })];

  function renderClient(d) {
    const c = d.client;
    document.title = `${c.name} · Outreach Desk`;
    $("client-name").textContent = c.name;
    $("client-card").replaceChildren(card(c, null));
    calendar($("client-cal"), c.days || {}, () => {});
    let current = "completed";
    const show = key => {
      current = key; const v = VIEWS.find(v => v.key === key); const rows = v.rows ? v.rows(c) : (c[key] || []);
      for (const b of $("seg").children) b.setAttribute("aria-selected", String(b.dataset.key === key));
      $("st-hint").textContent = v.hint;
      $("st-head").replaceChildren(el("tr", {}, ...v.head.map(h => el("th", { text: h }))));
      $("st-body").replaceChildren(...(rows.length ? rows.map(x => el("tr", {}, ...(v.row ? v.row(x) : convRow(x, key)))) : [empty(v.head.length, v.empty)]));
    };
    $("seg").replaceChildren(...VIEWS.map(v => {
      const n = (v.rows ? v.rows(c) : (c[v.key] || [])).length;
      const b = el("button", { type: "button", role: "tab", "data-key": v.key }, v.label, el("b", { text: String(n) }));
      b.addEventListener("click", () => show(v.key)); return b;
    }));
    show(current);
    $("fills-when").textContent = d.updated ? `Last refreshed ${d.updated} IST` : "";
    const fills = c.fills || [];
    $("fills").replaceChildren(...(fills.length ? fills.map(f => el("tr", {},
      el("td", { class: "when num", text: f.date + (f.time ? ", " + f.time : "") }, f.time ? null : el("small", { class: "ph", text: "time to be added" })),
      el("td", {}, f.source ? f.source : el("span", { class: "ph", text: "Peec / MaxVisibility / Athena HQ: to be added" })),
      el("td", { class: "num strong", text: f.added }), el("td", { class: "num", text: f.waiting }), el("td", { class: "num", text: f.left }))) :
      [empty(5, "No refills logged yet.")]));
    $("view-client").hidden = false;
    requestAnimationFrame(() => {   // show the header and two rows; scroll for the rest
      const w = $("fills-wrap"), rs = w.querySelectorAll("tbody tr");
      if (rs.length > 2) w.style.maxHeight = (w.querySelector("thead").offsetHeight + rs[0].offsetHeight + rs[1].offsetHeight + 2) + "px";
    });
  }

  const cell = csv => { const t = csv.trim(); return t.startsWith('"') ? t.slice(1, -1).replace(/""/g, '"') : t; };
  fetch(DATA + (DATA.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const d = JSON.parse(cell(text));
      const when = d.updated ? `Updated ${d.updated} IST` : "";
      $("updated").textContent = when; $("client-updated").textContent = when; $("home-updated").textContent = when;
      nav(d);
      if (MODE === "team") return renderTeam(d);
      const c = d.clients.find(x => x.slug === SLUG);
      if (!c) throw new Error("no client");
      renderClient({ client: c, updated: d.updated });
    })
    .catch(() => { const b = $("banner"); b.textContent = "The dashboard data couldn't be loaded. Refresh the page; if it keeps failing, ask the team."; b.className = "banner err"; b.hidden = false; });
})();
</script>
</body>
</html>
